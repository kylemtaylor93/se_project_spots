<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Kyle Taylor" />
    <meta name="description" content="????" />
    <meta name="keywords" content="HTML, CSS, ????" />
    <title>Spots</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          src="<%=require('./images/logo.svg')%>"
          alt="Spot logo"
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                src="<%=require('./images/pencil-light.png')%>"
                alt="Pencil Icon"
                class="profile__pencil-icon"
              />
            </button>
            <img
              src="<%=require('./images/avatar.jpg')%>"
              alt="Bessie Coleman"
              class="profile__avatar"
            />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-btn" type="button">
              <img
                src="<%=require('./images/pencil.svg')%>"
                alt="Pencil icon"
              />
              Edit Profile
            </button>
          </div>
          <button class="profile__new-post-btn" type="button">
            <img src="<%=require('./images/Plus.svg')%>" alt="Plus icon" /> New
            Post
          </button>
        </section>

        <section class="cards page__section">
          <ul class="cards__list"></ul>

          <template id="card-template">
            <li class="card">
              <button
                aria-label="delete card"
                class="card__delete-btn"
                type="button"
              ></button>
              <img class="card__image" src="#" alt="" />
              <div class="card__footer">
                <h2 class="card__title"></h2>
                <button
                  aria-label="like card"
                  class="card__like-btn"
                  type="button"
                ></button>
              </div>
            </li>
          </template>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__copyright">2025 &copy; Spots</p>
      </footer>

      <!-- Edit Profile Modal -->
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit Profile</h2>
          <form class="modal__form" id="edit-profile-form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                required
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type your name"
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                required
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe yourself"
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button
              type="submit"
              class="modal__save-btn"
              data-default-text="Save"
            >
              Save
            </button>
          </form>
        </div>
      </div>

      <!-- New Post Modal -->
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form" id="new-post-form" novalidate>
            <label for="card-image-input" class="modal__label">
              Image link
              <input
                required
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Place a link to the picture"
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="card-caption-input" class="modal__label">
              Caption
              <input
                required
                id="card-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type your caption"
                minlength="2"
                maxlength="30"
              />
              <span id="card-caption-input-error" class="modal__error"></span>
            </label>
            <button
              type="submit"
              class="modal__save-btn"
              data-default-text="Save"
            >
              Save
            </button>
          </form>
        </div>
      </div>

      <!-- Preview Modal -->
      <div class="modal" id="preview-modal">
        <div class="modal__content">
          <button
            aria-label="Close modal"
            class="modal__close-btn"
            type="button"
          ></button>
          <img src="#" alt="" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>

      <!-- Edit Avatar Modal -->
      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>
          <h2 class="modal__title">Edit avatar</h2>
          <form class="modal__form" id="edit-avatar-form" novalidate>
            <label for="profile-avatar-input" class="modal__label">
              Avatar
              <input
                required
                id="profile-avatar-input"
                name="avatar"
                type="url"
                class="modal__input"
                placeholder="Avatar goes here"
              />
              <span id="profile-avatar-input-error" class="modal__error"></span>
            </label>
            <button
              type="submit"
              class="modal__save-btn"
              data-default-text="Save"
            >
              Save
            </button>
          </form>
        </div>
      </div>

      <!-- Delete Modal -->
      <div class="modal" id="delete-modal">
        <div class="modal__content">
          <button type="button" class="modal__close-btn"></button>
          <h3 class="modal__title">
            Are you sure you want to delete this image?
          </h3>
          <form class="modal__form" id="delete-form" action="#" novalidate>
            <button
              type="submit"
              class="modal__save-btn"
              data-default-text="Delete"
            >
              Delete
            </button>
            <button type="button" class="modal__cancel-btn">Cancel</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
